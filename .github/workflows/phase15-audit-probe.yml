name: Phase 15 audit fix probe

on:
  push:
    branches:
      - phase/15-performance-content

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Probe pnpm security fixes
        run: |
          pnpm audit --fix --audit-level high || true
          pnpm install --lockfile-only --no-frozen-lockfile
          echo "=== PACKAGE AFTER ==="
          cat package.json
          echo "=== LOCK PACKAGE BLOCKS ==="
          grep -n -A5 -B2 -E 'nanoid@|fast-uri@|js-yaml@|undici@|brace-expansion@|hono@|ip-address@|qs@' pnpm-lock.yaml
          echo "=== AUDIT AFTER ==="
          pnpm audit --audit-level high

name: Phase 15 security lock refresh

on:
  push:
    branches:
      - phase/15-performance-content

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase/15-performance-content

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Refresh security-patched dependency graph
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "Dependency graph already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: refresh security-patched lockfile"
          git push origin HEAD:phase/15-performance-content

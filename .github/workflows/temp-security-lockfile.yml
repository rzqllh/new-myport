name: Temporary Security Lockfile Refresh

on:
  push:
    branches:
      - chore/security-dependency-remediation

permissions:
  contents: write

jobs:
  refresh:
    if: "github.event.head_commit.message == 'chore: generate security lockfile'"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.10.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Audit production dependency graph
        run: pnpm audit --prod --audit-level high
      - name: Commit reviewed security dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --exit-code && exit 0
          git commit -m "chore(security): regenerate pnpm lockfile"
          git push origin HEAD:chore/security-dependency-remediation
